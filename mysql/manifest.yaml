apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: mysql
  namespace: roboshop
  # there labels are replicaset labels
  labels:
    project: roboshop
    tier: db
    component: mysql

spec:
    replicas: 1
    selector:
    # using there labels replica set selectts the pod 
      matchLabels:
        project: roboshop
        tier: db
        component: mysql
    # this is pod definition, pod is subset of replica set.
    template:
      metadata:
        labels:
          project: roboshop
          tier: db
          component: mysql
      spec:
        containers:
        - name: mysql
          image: gopalk1/mysql:1.4.0

---

apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
spec:
  selector:
  # labels are used as selectors 
    project: roboshop
    tier: db
    component: mysql
    
  ports:
  - protocol: TCP
    port: 3306 # service port
    targetPort: 3306 # container port